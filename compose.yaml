services:
  traefik:
    image: traefik:v3
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      - "--api.insecure=true"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/dynamic:/etc/traefik/dynamic:ro"
      - "./traefik/certs:/etc/traefik/certs:ro"
    networks:
      cla321-network:
      k3d-dev:
        aliases:
          - registry.gitlab.localhost
          - headlamp.localhost
          - gitlab.localhost

  gitlab:
    image: gitlab/gitlab-ce:19.3.0-ce.0
    container_name: gitlab
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cla321-network"

      - "traefik.http.routers.gitlab.rule=Host(`gitlab.localhost`)"
      - "traefik.http.routers.gitlab.entrypoints=websecure"
      - "traefik.http.routers.gitlab.tls=true"
      - "traefik.http.routers.gitlab.service=gitlab"
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"

      - "traefik.http.routers.gitlab-registry.rule=Host(`registry.gitlab.localhost`)"
      - "traefik.http.routers.gitlab-registry.entrypoints=websecure"
      - "traefik.http.routers.gitlab-registry.tls=true"
      - "traefik.http.routers.gitlab-registry.service=gitlab-registry"
      - "traefik.http.services.gitlab-registry.loadbalancer.server.port=5005"

    ports:
      - "2222:22"

    environment:
      TZ: Australia/Sydney

      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.localhost'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        
        gitlab_rails['nginx']['listen_port'] = 80
        gitlab_rails['nginx']['listen_https'] = false
        
        registry_external_url 'https://registry.gitlab.localhost'
        
        registry['enable'] = true
        gitlab_rails['registry_enabled'] = true
        
        registry['nginx']['listen_port'] = 5005
        registry['nginx']['listen_https'] = false
        
        registry['env'] = {
          "REGISTRY_HTTP_RELATIVEURLS" => true
        }
        
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 4
        
        letsencrypt['enable'] = false

    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

    shm_size: "256m"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost/-/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m

    networks:
      cla321-network:
        aliases:
         - gitlab.localhost
         - registry.gitlab.localhost

  gitlab_runner:
    image: gitlab/gitlab-runner:alpine
    container_name: gitlab_runner

    depends_on:
      gitlab:
        condition: service_healthy

    environment:
      TZ: Australia/Sydney

    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - cla321-network


  openbao:
    image: openbao/openbao:2.6.2
    container_name: openbao

    depends_on:
      openbao_init:
        condition: service_completed_successfully

    command:
      - server

    environment:
      BAO_ADDR: http://127.0.0.1:8200

    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/data

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cla321-network"

      - "traefik.http.routers.openbao.rule=Host(`openbao.localhost`)"
      - "traefik.http.routers.openbao.entrypoints=websecure"
      - "traefik.http.routers.openbao.tls=true"
      - "traefik.http.routers.openbao.service=openbao"

      - "traefik.http.services.openbao.loadbalancer.server.port=8200"

    networks:
      cla321-network:

  openbao_init:
    image: alpine:3.22
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 100:100 /openbao/data
    volumes:
      - openbao-data:/openbao/data


networks:
  cla321-network:
    name: cla321-network

  k3d-dev:
    external: true
    name: k3d-dev

volumes:
  gitlab-runner-config:
  gitlab-config:
  gitlab-logs:


  gitlab-data:
  openbao-data:
